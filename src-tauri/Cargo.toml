[package]
name = "atoll"
version = "0.1.0"
description = "Atoll — canvas-based AI generation studio powered by MCP providers"
authors = ["Infision"]
license = "MIT"
repository = "https://github.com/infisionai/atoll"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "atoll_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
# bundled: statically included to avoid system sqlite version drift
rusqlite = { version = "0.32", features = ["bundled"] }
# For the MCP streamable HTTP client (near-standard — conventions exception)
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# For the OAuth PKCE implementation (near-standard crypto/encoding utils)
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
portable-pty = "0.9.0"
