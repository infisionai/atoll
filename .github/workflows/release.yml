# Desktop release — build macOS (Apple Silicon + Intel) and Windows installers
# and attach them to a draft GitHub Release.
#
# Flow: bump the version (tauri.conf.json / package.json / Cargo.toml) →
#       `git tag v0.x.y && git push --tags` → this workflow builds and uploads →
#       write the changelog on the draft Release and publish.
#
# Unsigned for now: macOS users must right-click → Open on first launch
# (or `xattr -cr Atoll.app`); Windows shows a SmartScreen prompt.
# Signing/notarization can be wired in later via tauri-action secrets.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for testing the pipeline without tagging
  workflow_dispatch:

# One release build at a time; a newer tag supersedes an in-flight run
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write # create the release and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14 # Apple Silicon
            target: aarch64-apple-darwin
          - platform: macos-15-intel # Intel (macos-13 was retired 2025-12)
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: '' # host target
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm 11 (bundled with Node 24) resolves optional peer deps the same
          # way as local installs; npm 10 rejects this lockfile
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache cargo builds — cuts rebuild time dramatically
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only meaningful on tag pushes; workflow_dispatch just builds
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Atoll ${{ github.ref_name }}'
          releaseBody: 'See the changelog below. macOS: right-click → Open on first launch (unsigned build). Windows: choose "More info → Run anyway" on the SmartScreen prompt.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
